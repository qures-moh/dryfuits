<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Warm Amber Glow -->
    <linearGradient id="amberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Royal Forest Green -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Circular Royal Frame -->
  <circle cx="60" cy="60" r="56" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3" filter="url(#badgeShadow)"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- Inner Soft Warm Background -->
  <circle cx="60" cy="60" r="47" fill="#fefdf9"/>

  <!-- Laurel Harvest Wreath (Left side) -->
  <g fill="url(#greenGrad)">
    <path d="M 28 65 C 24 57 26 45 32 38 C 30 44 32 52 35 56 Z"/>
    <path d="M 25 52 C 22 45 26 36 33 31 C 30 38 32 44 33 48 Z"/>
    <path d="M 29 39 C 28 32 34 24 41 22 C 37 28 37 34 36 37 Z"/>
    <path d="M 38 28 C 38 22 46 17 53 17 C 48 22 46 27 44 29 Z"/>
  </g>

  <!-- Laurel Harvest Wreath (Right side) -->
  <g fill="url(#greenGrad)">
    <path d="M 92 65 C 96 57 94 45 88 38 C 90 44 88 52 85 56 Z"/>
    <path d="M 95 52 C 98 45 94 36 87 31 C 90 38 88 44 87 48 Z"/>
    <path d="M 91 39 C 92 32 86 24 79 22 C 83 28 83 34 84 37 Z"/>
    <path d="M 82 28 C 82 22 74 17 67 17 C 72 22 74 27 76 29 Z"/>
  </g>

  <!-- Central Crown Crest -->
  <path d="M 49 33 L 53 38 L 60 30 L 67 38 L 71 33 L 70 41 L 50 41 Z" fill="url(#goldGrad)"/>
  <circle cx="60" cy="27" r="2.5" fill="url(#goldGrad)"/>
  <circle cx="49" cy="30" r="2" fill="url(#goldGrad)"/>
  <circle cx="71" cy="30" r="2" fill="url(#goldGrad)"/>

  <!-- Centerpiece: Royal Golden Almond & Walnut Kernels -->
  <!-- Whole Almond Body -->
  <path d="M 60 45 C 50 52 46 68 53 79 C 58 87 68 87 71 78 C 76 65 72 50 60 45 Z" fill="url(#goldGrad)"/>
  <path d="M 60 48 C 53 54 50 66 55 76 C 58 82 66 82 68 75 C 72 65 69 52 60 48 Z" fill="#fff7ed" opacity="0.25"/>

  <!-- Almond Fine Grain Details -->
  <path d="M 59 52 C 55 60 56 71 62 77" fill="none" stroke="#78350f" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 63 56 C 65 63 65 71 61 75" fill="none" stroke="#78350f" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>

  <!-- Cashew Silhouette overlay left -->
  <path d="M 44 64 C 40 68 39 76 43 81 C 48 85 54 83 55 79 C 56 75 51 76 48 74 C 45 71 46 66 48 64 Z" fill="url(#amberGrad)" opacity="0.95"/>

  <!-- Pistachio Kernel overlay right -->
  <path d="M 76 64 C 80 68 81 76 77 81 C 72 85 66 83 65 79 C 64 75 69 76 72 74 C 75 71 74 66 72 64 Z" fill="url(#greenGrad)" opacity="0.95"/>

  <!-- Ribbon Banner at Bottom with Gold Trim -->
  <path d="M 30 89 L 60 85 L 90 89 L 85 97 L 60 93 L 35 97 Z" fill="url(#amberGrad)"/>
  <path d="M 35 90 L 60 87 L 85 90" stroke="#fef3c7" stroke-width="1" fill="none"/>

  <!-- Star Emblems below ribbon -->
  <polygon points="60,98 61.5,102 66,102 62.5,104.5 64,108.5 60,106 56,108.5 57.5,104.5 54,102 58.5,102" fill="url(#goldGrad)"/>
  <polygon points="48,99 49,101.5 52,101.5 49.5,103 50.5,105.5 48,104 45.5,105.5 46.5,103 44,101.5 47,101.5" fill="url(#goldGrad)"/>
  <polygon points="72,99 73,101.5 76,101.5 73.5,103 74.5,105.5 72,104 69.5,105.5 70.5,103 68,101.5 71,101.5" fill="url(#goldGrad)"/>
</svg>
